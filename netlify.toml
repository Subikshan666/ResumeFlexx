[build]
  command = "pip install -r requirements.txt"
  functions = "netlify/functions"
  publish = "public"

[dev]
  command = "python app.py"
  port = 5000

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app"
  status = 200

[functions]
  external_node_modules = []
  node_bundler = "esbuild"
