[build]
  command = "pip install -r requirements.txt"
  functions = "functions"
  publish = "netlify_public"

[dev]
  command = "python app.py"
  port = 5000

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/.netlify/functions/app"
  status = 200
  force = true


[functions]
  node_bundler = "esbuild"
